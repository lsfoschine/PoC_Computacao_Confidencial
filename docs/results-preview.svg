<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="958" height="418" rx="17" fill="none" stroke="#30363d"/>
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="28" r="6" fill="#27c93f"/>
  <text x="92" y="34" fill="#8b949e" font-family="monospace" font-size="14">summary.csv — repeated benchmark output</text>

  <text x="28" y="82" fill="#58a6ff" font-family="monospace" font-size="15">Configuration</text>
  <text x="28" y="112" fill="#c9d1d9" font-family="monospace" font-size="14">model_id       BAAI/bge-m3</text>
  <text x="28" y="136" fill="#c9d1d9" font-family="monospace" font-size="14">max_length     512</text>
  <text x="28" y="160" fill="#c9d1d9" font-family="monospace" font-size="14">batch           16</text>
  <text x="28" y="184" fill="#c9d1d9" font-family="monospace" font-size="14">n_runs           3</text>

  <text x="354" y="82" fill="#58a6ff" font-family="monospace" font-size="15">Reported statistics</text>
  <text x="354" y="112" fill="#c9d1d9" font-family="monospace" font-size="14">docs_per_sec_mean</text>
  <text x="354" y="136" fill="#c9d1d9" font-family="monospace" font-size="14">docs_per_sec_stddev</text>
  <text x="354" y="160" fill="#c9d1d9" font-family="monospace" font-size="14">docs_per_sec_ci95</text>
  <text x="354" y="184" fill="#c9d1d9" font-family="monospace" font-size="14">p50_ms_mean / p50_ms_ci95</text>
  <text x="354" y="208" fill="#c9d1d9" font-family="monospace" font-size="14">p95_ms_mean / p95_ms_ci95</text>

  <line x1="28" y1="242" x2="932" y2="242" stroke="#30363d"/>
  <text x="28" y="278" fill="#3fb950" font-family="monospace" font-size="15">Audit checks</text>
  <text x="28" y="310" fill="#c9d1d9" font-family="monospace" font-size="14">✓ corpus_sha256 and warmup_corpus_sha256 match</text>
  <text x="28" y="336" fill="#c9d1d9" font-family="monospace" font-size="14">✓ Git commit, dirty state, uv.lock hash, and environment recorded</text>
  <text x="28" y="362" fill="#c9d1d9" font-family="monospace" font-size="14">✓ Individual runs retained in runs.csv and results/&lt;matrix_run_id&gt;/</text>
  <text x="28" y="394" fill="#8b949e" font-family="monospace" font-size="13">Illustrative layout; no performance gain is claimed by this image.</text>
</svg>
